name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar o ambiente Java (Java 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Dar permissão de execução ao Maven Wrapper e compilar o projeto
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # 4. Configurar o Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Fazer login no Docker Hub (Certifique-se de configurar os Secrets no GitHub)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build e Push da imagem Docker com a tag do commit atual
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: uverdocker/bff-1.0.0:${{ github.sha }}

      # 7. Atualizar automaticamente a tag no manifesto do Kubernetes (GitOps)
      - name: Update Kubernetes Manifest
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Ajuste o caminho do arquivo de manifesto abaixo conforme a estrutura do seu projeto
          sed -i 's|image: uverdocker/bff-1.0.0:.*|image: uverdocker/bff-1.0.0:${{ github.sha }}|g' k8s/deployment.yaml
          
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}"
          git push